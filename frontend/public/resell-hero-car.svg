<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="565" viewBox="0 0 1120 565" role="img" aria-labelledby="title desc">
<title id="title">Contemporary sports coupe</title>
<desc id="desc">Stylized silver sports coupe illustrated on a transparent background</desc>
<defs>
  <linearGradient id="body" x1=".3" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#fbffff"/><stop offset=".25" stop-color="#b6ced2"/><stop offset=".48" stop-color="#627f8a"/><stop offset=".72" stop-color="#d2e3de"/><stop offset="1" stop-color="#354c5c"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2f3e7"/><stop offset=".48" stop-color="#476878"/><stop offset="1" stop-color="#101e2b"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#97acac"/><stop offset="1" stop-color="#283b4b"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef8f1"/><stop offset=".5" stop-color="#60788b"/><stop offset="1" stop-color="#d9e3e0"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#b6e880" stop-opacity=".40"/><stop offset="1" stop-color="#b6e880" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-50%" y="-120%" width="200%" height="350%"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
